name: 01 building blocks
on:
  push:
    branches:
      - sunil-dev
  workflow_dispatch:
    inputs:
      environments:
        description: Environment to deploy to
        type: choice
        options:
          - dev
          - uat
        default: dev
        required: false
      log_level:
        description: 'Log level'
        required: false
        options:
          - debug
          - info
          - error
        default: info

jobs:
  echo-hello-job:
    runs-on: ubuntu-latest
    steps:
      - name: echo-hello
        run: echo "Hello, world!!"
  echo-goodbye-job:
    runs-on: ubuntu-latest
    steps:
      - name: Failed step
        run: |
          echo "I will fail!!"
          exit 0
      - name: Say goodbye
        run: echo "Goodbye!!"






